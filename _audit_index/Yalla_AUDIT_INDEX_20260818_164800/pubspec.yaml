name: yalla_accounts
description: تطبيق Yalla المحاسبي
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  synchronized: ^3.1.0

  # وسائط ومعالجة صور
  image: ^4.2.0
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  file_picker: ^8.1.2

  # واجهة وأساسيات
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  responsive_builder: ^0.7.0

  # إدارة الحالة
  flutter_riverpod: ^2.4.9

  # التوجيه
  go_router: ^14.2.3

  # اللغات والتوطين
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # التخزين ومعلومات الجهاز
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  package_info_plus: ^8.1.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0       # ← تمت إضافتها هنا
  win32: ^5.5.0

  # قاعدة البيانات (موبايل + سطح المكتب)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  crypto: ^3.0.6

  # PDF / طباعة / تصدير ملفات
  pdf: ^3.11.1
  printing: ^5.13.0
  open_file: ^3.4.0

  # الرسوم والبيانات
  fl_chart: ^0.68.0
  pie_chart: ^5.4.0

  # Excel + ZIP Export
  excel: ^4.0.6
  archive: ^3.4.0

  # متفرقات
  uuid: ^4.4.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_facebook_auth: ^7.1.0
  sign_in_with_apple: ^6.1.0
  badges: ^3.1.2
  speech_to_text: ^6.6.0
  flutter_slidable: ^3.1.0
  url_launcher: ^6.3.0
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  font_awesome_flutter: ^10.7.0
  flutter_secure_storage: ^9.2.2
  clipboard: ^0.1.3
  reorderable_grid_view: ^2.2.8
  reorderables: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/fonts/
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-Bold.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/TraditionalArabic-Regular.ttf
    - assets/fonts/Tahoma-Regular.ttf
