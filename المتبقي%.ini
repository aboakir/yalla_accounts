خطة التنفيذ الدقيقة (1 → 6)
الخطوة (1): تنفيذ عملية التظهير Endorsement

المخرجات:

إضافة Popup عند الضغط على "تظهير شيك".

يحتوي:

اختيار مورد

تاريخ التظهير

ملاحظات اختيارية

عند الحفظ:

إنشاء شيك جديد Outgoing

تعبئة originChequeId = الشيك الأصلي

تعبئة isEndorsed = 1 للشيك الأصلي

تعبئة endorsedAt = التاريخ

نقل نفس amount والعملات والتواريخ كما هي (أو نناقش التغيير إن بدك)

إنشاء Payment جديد للشيك المظهّر.

الملفات التي سنعدلها:

cheque_details_screen.dart

cheque_provider.dart

cheque_service.dart (للداتابيس)

cheque_link_service.dart

(سأطلب كل ملف قبل كتابة الكود)

الخطوة (2): تحديث شاشة تفاصيل الشيك

المطلوب:

إضافة قسم جديد يظهر التالي:

هل هذا الشيك مظهّر؟

إذا نعم → يظهر: "مُظهّر إلى المورد X بتاريخ Y".

هل هذا الشيك صادر من تظهير؟

إذا نعم → يظهر: "أصل الشيك رقم X".

زر تظهير شيك (إذا كان وارد وغير مظهّر).

الملف الذي سنعدله:

cheque_details_screen.dart

الخطوة (3): ربط الشيك الناتج بـ Payments + GL

المخرجات:

PaymentService.insert

PaymentService.postPaymentFromDbId

PaymentService.update/payment delete عند تعديل تظهير

لازم يتم تنفيذ التظهير عبر ChequeLinkService بشكل كامل.

سنعدّل:

cheque_link_service.dart

الخطوة (4): عرض سلسلة التظهيرات Chain

المخرجات:

داخل شاشة التفاصيل نعرض:

الشيك الأصلي إذا هذا نتيجة تظهير

الشيكات التي تم تظهيرها منه

سنعدّل:

cheque_service.dart لإضافة دوال:

getEndorsedChildren

getOriginCheque

cheque_details_screen.dart لإظهارهم في UI.

الخطوة (5): تحديث التقارير

المخرجات:

تقرير الشيكات يضيف عمود "مظهّر؟"

تصفية الشيكات المظهّرة عند الحاجة

الشيك المظهّر الجديد يظهر كمستند مستقل

سنعدّل:

cheques_report_screen.dart

الخطوة (6): إلغاء التظهير Undo Endorsement

المخرجات:
عند الإلغاء:

حذف الشيك الصادر الناتج عن التظهير

تحديث الشيك الأصلي:

isEndorsed = 0

endorsedAt = null

originChequeId = null

سنعدّل:

cheque_details_screen.dart

cheque_provider.dart

cheque_service.dart