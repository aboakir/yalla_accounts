name: Yalla Accounts iOS Build Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounts-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  unsigned_ios_verification:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record Apple toolchain
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          pod --version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Materialize validated production defines
        env:
          LICENSING_URL: ${{ secrets.YALLA_LICENSING_BASE_URL }}
          LICENSE_PIN: ${{ secrets.YALLA_LICENSE_TRUSTED_KEY_SHA256 }}
          SUPABASE_URL: ${{ secrets.YALLA_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.YALLA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          required = ['LICENSING_URL','LICENSE_PIN','SUPABASE_URL','SUPABASE_KEY']
          missing = [k for k in required if not os.environ.get(k, '').strip()]
          if missing: raise SystemExit('Missing protected release inputs: ' + ','.join(missing))
          data = {
            'YALLA_LICENSING_BASE_URL': os.environ['LICENSING_URL'],
            'YALLA_LICENSE_TRUSTED_KEY_SHA256': os.environ['LICENSE_PIN'],
            'YALLA_SUPABASE_URL': os.environ['SUPABASE_URL'],
            'YALLA_SUPABASE_PUBLISHABLE_KEY': os.environ['SUPABASE_KEY'],
            'YALLA_CLOUD_AUTH_RELEASE_READY': True,
            'YALLA_CLOUD_OAUTH_ENABLED': False,
            'YALLA_STORE_DISTRIBUTION': True,
          }
          open('deploy/production_defines.json','w',encoding='utf-8').write(json.dumps(data))
          PY
          dart run tools/validate_production_defines.dart deploy/production_defines.json
          node tools/release/validate_release_matrix.mjs

      - name: Verify iOS architecture contract
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub test/commercial/ios_database_architecture_contract_test.dart

      - name: Install CocoaPods from canonical repository Podfile
        run: |
          set -euo pipefail
          test -f ci/Podfile
          cp ci/Podfile ios/Podfile
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS release verification artifact
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --dart-define-from-file=deploy/production_defines.json

      - name: Package and hash unsigned IPA
        run: |
          set -euo pipefail
          rm -rf dist Payload
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload dist/Yalla_Accounts_Unsigned_iPhone.ipa
          shasum -a 256 dist/Yalla_Accounts_Unsigned_iPhone.ipa | tee dist/SHA256.txt
          rm -f deploy/production_defines.json

      - name: Upload unsigned verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: yalla-accounts-ios-verification-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
