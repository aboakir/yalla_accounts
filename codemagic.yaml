workflows:
  ios_verification:
    name: Yalla Accounts iOS Verification
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - yalla_release
      flutter: 3.44.8
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify source and toolchain
        script: |
          set -euo pipefail
          test -f pubspec.yaml
          grep -Eq '^name:[[:space:]]*yalla_accounts[[:space:]]*$' pubspec.yaml
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve locked dependencies
        script: |
          set -euo pipefail
          flutter pub get --enforce-lockfile

      - name: Materialize protected production defines
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          required = [
            'YALLA_LICENSING_BASE_URL','YALLA_LICENSE_TRUSTED_KEY_SHA256',
            'YALLA_SUPABASE_URL','YALLA_SUPABASE_PUBLISHABLE_KEY'
          ]
          missing = [k for k in required if not os.environ.get(k, '').strip()]
          if missing: raise SystemExit('Missing protected release inputs: ' + ','.join(missing))
          data = {
            'YALLA_LICENSING_BASE_URL': os.environ['YALLA_LICENSING_BASE_URL'],
            'YALLA_LICENSE_TRUSTED_KEY_SHA256': os.environ['YALLA_LICENSE_TRUSTED_KEY_SHA256'],
            'YALLA_SUPABASE_URL': os.environ['YALLA_SUPABASE_URL'],
            'YALLA_SUPABASE_PUBLISHABLE_KEY': os.environ['YALLA_SUPABASE_PUBLISHABLE_KEY'],
            'YALLA_CLOUD_AUTH_RELEASE_READY': True,
            'YALLA_CLOUD_OAUTH_ENABLED': False,
            'YALLA_STORE_DISTRIBUTION': True,
          }
          open('deploy/production_defines.json','w',encoding='utf-8').write(json.dumps(data))
          PY
          dart run tools/validate_production_defines.dart deploy/production_defines.json
          node tools/release/validate_release_matrix.mjs
      - name: Analyze and verify iOS contract
        script: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub test/commercial/ios_database_architecture_contract_test.dart

      - name: Install canonical CocoaPods input
        script: |
          set -euo pipefail
          test -f ci/Podfile
          cp ci/Podfile ios/Podfile
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS verification artifact
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define-from-file=deploy/production_defines.json

      - name: Package and hash IPA
        script: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          OUT="build/ios/ipa"
          test -d "$APP"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/Runner.app"
          (cd "$OUT" && zip -qry "Yalla_Accounts_Unsigned_iPhone.ipa" Payload)
          shasum -a 256 "$OUT/Yalla_Accounts_Unsigned_iPhone.ipa" > "$OUT/SHA256.txt"
          rm -f deploy/production_defines.json
    artifacts:
      - build/ios/ipa/Yalla_Accounts_Unsigned_iPhone.ipa
      - build/ios/ipa/SHA256.txt
      - /tmp/xcodebuild_logs/*.log

  ios_unified_owner:
    name: Yallah Accounts Owner iPhone 1.0.2+21 DB84
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'codemagic/owner-unified-db84-20260920'
          include: true
          source: true
      cancel_previous_builds: false
    environment:
      flutter: 3.44.8
      node: 24
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify exact unified source and version
        script: |
          set -euo pipefail
          node tools/release/verify_unified_ios_source.mjs
          flutter --version
          xcodebuild -version
      - name: Resolve locked dependencies
        script: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee build/ios/unified_evidence/dependencies.log
      - name: Analyze unified source
        script: |
          set -euo pipefail
          flutter analyze --no-pub 2>&1 | tee build/ios/unified_evidence/analyze.log
      - name: Full regression including both migration lineages
        script: |
          set -euo pipefail
          flutter test --no-pub --concurrency=4 --timeout=90s --reporter=json 2>&1 | tee build/ios/unified_evidence/tests.jsonl
      - name: Prepare iOS dependencies
        script: |
          set -euo pipefail
          cp ci/Podfile ios/Podfile
          (cd ios && pod install --repo-update) 2>&1 | tee build/ios/unified_evidence/pods.log
      - name: Build owner iPhone application
        script: |
          set -euo pipefail
          git diff --exit-code -- lib assets pubspec.yaml pubspec.lock
          flutter build ios --release --no-pub --no-codesign --dart-define=YALLA_OWNER_LOCAL_FULL_ACCESS=true 2>&1 | tee build/ios/unified_evidence/ios_build.log
      - name: Verify package identity and create IPA
        script: |
          set -euo pipefail
          bash tools/release/package_unified_owner_ios.sh
    artifacts:
      - build/ios/unified_owner_ipa/**/*.ipa
      - build/ios/unified_owner_ipa/**/BUILD_MANIFEST.json
      - build/ios/unified_owner_ipa/**/SHA256.txt
      - build/ios/unified_evidence/*
      - /tmp/xcodebuild_logs/*.log
