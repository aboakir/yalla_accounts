workflows:
  ios_unsigned:
    name: Yalla Accounts Unsigned iPhone
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify Yalla Accounts source
        script: |
          set -euo pipefail
          test -f pubspec.yaml
          grep -Eq '^name:[[:space:]]*yalla_accounts[[:space:]]*$' pubspec.yaml
          test -d ios
          echo "Yalla Accounts source verified."

      - name: Disable Flutter Swift Package Manager
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter config --list | grep -i swift || true

      - name: Get Flutter packages cleanly
        script: |
          set -euo pipefail
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          flutter pub get

      - name: Install iOS pods
        script: |
          set -euo pipefail
          test -f ci/Podfile
          rm -f ios/Podfile
          cp ci/Podfile ios/Podfile

          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock .symlinks
          cd ..

          flutter pub get

          cd ios
          pod install --repo-update



      - name: Build unsigned iPhone release
        script: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=YALLA_LICENSING_BASE_URL=https://catatonic-hazard-dingo.ngrok-free.dev \
            --dart-define=YALLA_LICENSE_TRUSTED_KEY_SHA256=4f0643aa24706753d1546836bf9cf17c35a53222ca63f8d0fb7451ea35643db5 \
            --dart-define=YALLA_SUPABASE_URL=https://srkskbuoyedwovxvvtvs.supabase.co \
            --dart-define=YALLA_SUPABASE_PUBLISHABLE_KEY=sb_publishable_6WbY9HxKgXTA2WGf4UPfRg_TPAMK043 \
            --dart-define=YALLA_CLOUD_AUTH_RELEASE_READY=true \
            --dart-define=YALLA_CLOUD_OAUTH_ENABLED=false

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          OUT="build/ios/ipa"

          test -d "$APP"

          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/Runner.app"

          (
            cd "$OUT"
            zip -qry "Yalla_Accounts_Unsigned_iPhone.ipa" Payload
          )

          test -f "$OUT/Yalla_Accounts_Unsigned_iPhone.ipa"
          ls -lh "$OUT/Yalla_Accounts_Unsigned_iPhone.ipa"

    artifacts:
      - build/ios/ipa/Yalla_Accounts_Unsigned_iPhone.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log



