workflows:
  yalla-ios-unsigned:
    name: Yalla Accounts — Unsigned iPhone
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify Yalla Accounts source
        script: |
          set -euo pipefail
          test -f pubspec.yaml
          grep -Eq '^name:[[:space:]]*yalla_accounts[[:space:]]*$' pubspec.yaml
          test -d ios
          echo "Yalla Accounts source verified."

      - name: Get Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Install iOS pods
        script: |
          set -euo pipefail
          cd ios
          pod install

      - name: Build unsigned iPhone release
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          OUT="build/ios/ipa"
          test -d "$APP"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/Runner.app"
          (
            cd "$OUT"
            zip -qry "Yalla_Accounts_Unsigned_iPhone.ipa" Payload
          )
          test -f "$OUT/Yalla_Accounts_Unsigned_iPhone.ipa"
          ls -lh "$OUT/Yalla_Accounts_Unsigned_iPhone.ipa"

    artifacts:
      - build/ios/ipa/Yalla_Accounts_Unsigned_iPhone.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
